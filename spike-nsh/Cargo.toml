[package]
name = "nsh-spike"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway spike: the app's menu bar + window on AppKit/nsh instead of Tauri, reusing src-tauri/src/core unchanged."

# Standalone: not a member of any workspace, so it never pulls Tauri in.
[workspace]

[dependencies]
# nsh's crates are `publish = false`, so they come from git.
nsh-core = { git = "https://github.com/longbridge/nsh", tag = "v0.3.0" }
nsh-base = { git = "https://github.com/longbridge/nsh", tag = "v0.3.0", default-features = false }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", tag = "v0.3.0", default-features = false }

objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
dispatch2 = "0.3.1"

# What src-tauri/src/core needs, at the versions src-tauri uses.
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
