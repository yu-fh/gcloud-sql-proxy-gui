[package]
name = "fh-cloud-sql-proxy-gui"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "fh_cloud_sql_proxy_gui"
path = "src/lib.rs"

[[bin]]
name = "fh-cloud-sql-proxy-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-png: the menu bar template icons are embedded PNGs decoded at runtime.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "5"

# The menu bar icon has to track the system appearance, and Tauri 2.11 exposes
# no app-level way to read it: `theme()` and the `ThemeChanged` event both hang
# off a `Window`, and this app is `LSUIElement` with no window at startup. So the
# tray reads `NSApp.effectiveAppearance` directly — see `appearance()` in
# `src/tray.rs`. Both crates are already in the tree via tao/wry; naming them
# here makes the dependency explicit rather than relying on that.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAppearance", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSArray"] }

[dev-dependencies]
tempfile = "3"
