<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cloud SQL Proxy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- Both windows load this same document. The tray opens the logs window at
         index.html#logs, and the hash alone selects the view: two windows, two
         views, no in-page switcher. See applyView() in profiles.js. -->

    <!-- The title bar is an Overlay, so the OS traffic lights float above this
         strip and the page has to supply both the clearance and the drag
         region a real title bar would give it. -->
    <header class="titlebar">
      <h1 id="window-title" class="titlebar-title">Profiles</h1>
    </header>

    <!-- Errors from any invoke land here, above the content of either view, so
         a failure is never only in the console. -->
    <div id="banner" class="banner" role="alert" hidden></div>

    <main class="content">
      <section id="view-profiles" class="view">
        <!-- Source list: one row per environment, selection drives the detail
             group below. Populated by renderEnvList(). -->
        <h2 class="group-label" id="env-label">Environments</h2>
        <div
          id="env-list"
          class="group group-list"
          role="listbox"
          aria-labelledby="env-label"
        ></div>

        <!-- The macOS source-list convention: small joined +/- buttons at the
             bottom-left of the group they act on. -->
        <div class="list-controls">
          <button
            id="btn-add"
            type="button"
            class="gutter-button"
            title="Add an environment"
            aria-label="Add an environment"
          >
            +
          </button>
          <button
            id="btn-delete"
            type="button"
            class="gutter-button"
            title="Delete the selected environment"
            aria-label="Delete the selected environment"
          >
            −
          </button>
        </div>

        <!-- Detail for the selected environment: status, first-run hint,
             failure text, and the editable fields. Built by renderDetail(). -->
        <h2 class="group-label" id="detail-label">Settings</h2>
        <div id="detail" class="detail" aria-labelledby="detail-label"></div>

        <!-- The refresh diff. refresh_connection_names() writes nothing; this
             shows what it proposes and only Apply commits it. -->
        <div id="changes" class="changes" hidden></div>
      </section>

      <section id="view-logs" class="view" hidden>
        <div class="logs-bar">
          <label class="logs-bar-label" for="log-filter">Profile</label>
          <select id="log-filter"></select>
          <span id="log-note" class="note" aria-live="polite"></span>
          <button id="btn-logs-refresh" type="button" class="push">
            Refresh
          </button>
        </div>
        <pre id="logs" class="logs">Loading…</pre>
      </section>
    </main>

    <!-- Window-footer actions, as a native settings sheet has them: secondary
         on the left, default button on the right. Hidden in the logs view. -->
    <footer id="footer" class="footer">
      <span id="save-note" class="note" aria-live="polite"></span>
      <button id="btn-reload" type="button">Revert</button>
      <button id="btn-refresh" type="button">Refresh Connection Names</button>
      <button id="btn-save" type="button" class="default">Done</button>
    </footer>

    <script type="module" src="/profiles.js"></script>
  </body>
</html>
