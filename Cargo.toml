[package]
name = "fh-cloud-sql-proxy-gui"
version = "0.1.4"
edition = "2021"

[lib]
name = "fh_cloud_sql_proxy_gui"
path = "src/lib.rs"

[[bin]]
name = "fh-cloud-sql-proxy-gui"
path = "src/main.rs"

[dependencies]
# nsh's crates are `publish = false`, so they come from git.
nsh-core = { git = "https://github.com/longbridge/nsh", tag = "v0.3.0" }
nsh-base = { git = "https://github.com/longbridge/nsh", tag = "v0.3.0", default-features = false }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", tag = "v0.3.0", default-features = false }

objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
dispatch2 = "0.3.1"

tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "5"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
