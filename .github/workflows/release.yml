name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release, e.g. v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish macOS DMG
    runs-on: macos-14
    permissions:
      # `gh release` creates the release and uploads the DMG to it.
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build
        # NOTE: this build is **not** signed with a Developer ID (it is signed
        # ad hoc, which is what lets it launch at all), so macOS quarantines
        # the DMG on download and refuses to open the app with "the developer
        # cannot be verified". The README documents the
        # `xattr -dr com.apple.quarantine` workaround for downloaders.
        #
        # To sign properly, import a Developer ID certificate into a keychain
        # in an earlier step and set SIGN_IDENTITY for this one:
        #
        #   SIGN_IDENTITY: "Developer ID Application: ... (TEAMID)"
        #
        # `scripts/bundle.sh` signs with it, with the hardened runtime on.
        # Notarisation is not wired up. Signing needs a paid Apple Developer
        # account.
        run: scripts/bundle.sh

      - name: Publish
        run: |
          notes=$(cat <<'NOTES'
          macOS universal build (Apple Silicon and Intel), macOS 14 or later.

          **This build is not signed**, so macOS will refuse to open it on
          first launch. To clear the quarantine flag after moving the app to
          `/Applications`:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Cloud SQL Proxy.app"
          ```

          See the README for what the app expects to find on your machine.
          NOTES
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber
          else
            gh release create "$TAG" dist/*.dmg --title "$TAG" --notes "$notes"
          fi
