name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # One run per branch. A new push cancels the previous run rather than queueing
  # behind it -- only the tip matters, and a Tauri build is not cheap.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Backtraces cost nothing here and turn a bare "panicked at" in the log into
  # something actionable without a re-run.
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test and lint
    # macOS because the app links against AppKit and WebKit -- it does not
    # compile anywhere else, so there is no cheaper runner to fall back to.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        # Warnings fail the build. This is a small codebase with no existing
        # clippy debt, so the alternative is that the first warning is ignored
        # and every one after it is invisible.
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  build:
    name: Build app bundle
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary; `bundle.sh` builds each and
          # joins them with `lipo`.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: scripts/bundle.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30
